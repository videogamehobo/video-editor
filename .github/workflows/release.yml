name: Release package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install packaging dependencies
        shell: powershell
        run: |
          winget install --id BtbN.FFmpeg.LGPL.8.1 --exact --silent --accept-package-agreements --accept-source-agreements
          winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
      - run: .\scripts\package.ps1
      - run: .\scripts\verify-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HighlightForge-win-x64
          path: |
            artifacts/win-x64
            artifacts/installer/*.exe
